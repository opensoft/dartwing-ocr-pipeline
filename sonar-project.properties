sonar.projectKey=opensoft_ledgerlinc-model-ocr-pipeline
sonar.organization=opensoft
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=src
sonar.tests=tests/contract_tests,tests/pipeline_tests,tests/unit,tests/integration,tests/evaluator_tests

# Exclude vendored Speckit scaffold from analysis. Files under
# .specify/ are installed from upstream spec-kit via a single
# scaffold-install commit and updated by re-running the installer,
# not edited in this repo. Analyzing them adds ~80 shell-rule
# findings (S7688 prefer-[[, etc.) that we'd have to re-suppress
# every time Speckit ships an update.
sonar.exclusions=.specify/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,scripts/**,step2_ocr_ensemble.py
