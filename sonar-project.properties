sonar.projectKey=opensoft_ledgerlinc-model-ocr-pipeline
sonar.organization=opensoft
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=src
sonar.tests=tests/contract_tests,tests/pipeline_tests,tests/unit,tests/integration,tests/evaluator_tests

# Exclude vendored Speckit scaffold + legacy scaffolding script +
# fixture/sample generators from analysis. Rationale:
#   .specify/**          vendored spec-kit; updated by re-running the
#                        installer, not edited here.
#   step2_ocr_ensemble.py  prototype script; CLAUDE.md notes it's
#                        scaffolding to be replaced (see "Current state
#                        vs. target" section).
#   tests/fixtures/**    deterministic PDF / image / data generators;
#                        run once to populate corpus folders.
#   scripts/generate_*.py  sample-data generators for the test corpus.
sonar.exclusions=.specify/**,step2_ocr_ensemble.py,tests/fixtures/**,scripts/generate_*.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,scripts/**,step2_ocr_ensemble.py
