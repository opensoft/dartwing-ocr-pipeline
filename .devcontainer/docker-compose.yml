services:
  pipeline-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: sleep infinity
    environment:
      # WSL_HOST_IP is populated by .devcontainer/devcontainer.json's
      # initializeCommand (or scripts/devcontainer-up.sh for manual starts).
      # When set, it points at the WSL distro's eth0 address, which is the
      # reliable route to host Ollama on this workstation's networking.
      # Falls back to host.docker.internal when unset — Docker Desktop's
      # host-gateway address, works when Docker Desktop's routing reaches
      # WSL host services. See docs/stage1-vendor-identity/ollama-runtime.md.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://${WSL_HOST_IP:-host.docker.internal}:11434}
    volumes:
      - ..:/workspace:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:rocm
    profiles: ["ollama"]
    container_name: dartwing-ollama
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8gb
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - ollama-models:/root/.ollama
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /usr/lib/wsl/lib/libd3d12.so:/usr/lib/libd3d12.so:ro
      - /usr/lib/wsl/lib/libd3d12core.so:/usr/lib/libd3d12core.so:ro
      - /opt/rocm-7.2.0/lib/libhsa-runtime64.so.1:/opt/rocm/lib/libhsa-runtime64.so.1:ro

volumes:
  ollama-models:
