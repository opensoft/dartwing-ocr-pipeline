[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlinc-ocr"
version = "0.1.0"
description = "LedgerLinc Stage 1 OCR pipeline: contracts and validator for vendor-identity artifacts."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ledgerlinc_ocr*"]

[project.scripts]
ledgerlinc-pipeline = "ledgerlinc_ocr.pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/contract_tests", "tests/pipeline_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
