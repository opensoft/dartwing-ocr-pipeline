[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlinc-ocr"
version = "0.1.0"
description = "LedgerLinc Stage 1 OCR pipeline: contracts and validator for vendor-identity artifacts."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
    "pypdfium2>=4.30,<5",
    "paddleocr>=3.5,<4",
    "paddlex[ocr]>=3.5,<4",
    "paddlepaddle>=3.0,<4",
    "Pillow>=10.4,<11",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pypdf>=5.0,<7",
    "pytest-socket>=0.7,<1",
]

[project.scripts]
ledgerlinc-preprocess = "ledgerlinc_ocr.preprocessing.cli:main"
ledgerlinc-pipeline = "ledgerlinc_ocr.pipeline.cli:main"
ledgerlinc-evidence-packet = "ledgerlinc_ocr.evidence_packet.cli:main"
ledgerlinc-extract = "ledgerlinc_ocr.extract.cli:main"
ledgerlinc-assemble = "ledgerlinc_ocr.assembler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ledgerlinc_ocr*"]

[tool.setuptools.package-data]
"ledgerlinc_ocr.extract.voters" = ["configs/*.yaml", "configs/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/contract_tests", "tests/pipeline_tests", "tests/unit", "tests/integration", "tests/evaluator_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --import-mode=importlib"
